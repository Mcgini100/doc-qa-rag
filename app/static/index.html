<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Protection Act Q&amp;A</title>
<style>
  :root { --bg:#f7f6f2; --fg:#1d1d1b; --muted:#6b6a65; --card:#fff; --line:#e3e1da; --accent:#1f5f4a; --warn:#8a4b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151614; --fg:#ecebe6; --muted:#a3a29b; --card:#1e1f1c; --line:#33342f; --accent:#7cc4a6; --warn:#e2a95a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 Georgia, "Iowan Old Style", serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-family: system-ui, sans-serif; font-size: .9rem; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:var(--bg); font:600 .95rem system-ui, sans-serif; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .examples { margin:10px 0 28px; font-family: system-ui, sans-serif; font-size:.85rem; color:var(--muted); }
  .examples a { color:var(--accent); cursor:pointer; margin-right:12px; text-decoration: underline dotted; }
  .answer { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; white-space:pre-wrap; }
  .answer.nf { color: var(--warn); }
  .meta { font: .8rem system-ui, sans-serif; color:var(--muted); margin:8px 2px 20px; }
  details { border-top:1px solid var(--line); padding:10px 2px; }
  summary { cursor:pointer; font: .9rem system-ui, sans-serif; }
  details p { font-size:.9rem; color:var(--muted); white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Cyber and Data Protection Act Q&amp;A</h1>
  <p class="sub">Answers come only from the Zimbabwe Cyber and Data Protection Act [Chapter 12:07], with the passages they rely on. Not legal advice.</p>
  <form id="f">
    <input id="q" placeholder="Ask a question about the Act" maxlength="500" required minlength="3" aria-label="Question">
    <button id="b">Ask</button>
  </form>
  <div class="examples">Try:
    <a>How quickly must a security breach be reported?</a>
    <a>What rights does a data subject have?</a>
    <a>What is the penalty for spam?</a>
  </div>
  <div id="out"></div>
</main>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b'), out = document.getElementById('out');
document.querySelectorAll('.examples a').forEach(a => a.onclick = () => { q.value = a.textContent; f.requestSubmit(); });
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
f.onsubmit = async e => {
  e.preventDefault(); b.disabled = true; out.innerHTML = '<p class="meta">Searching…</p>';
  try {
    const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question: q.value})});
    const d = await r.json();
    if (!r.ok) { out.innerHTML = `<div class="answer nf">${esc(d.detail ? JSON.stringify(d.detail) : d.error || 'Request failed')}</div>`; return; }
    const cites = d.citations.map(c => `<details><summary>[${c.n}] page ${c.pages}${c.sections.length ? ' · ' + esc(c.sections.join('; ')) : ''}</summary><p>${esc(c.text)}</p></details>`).join('');
    out.innerHTML = `<div class="answer ${d.found ? '' : 'nf'}">${esc(d.answer)}</div><p class="meta">mode: ${d.mode} · ${d.citations.length} passages</p>${cites}`;
  } catch (err) { out.innerHTML = `<div class="answer nf">${esc(String(err))}</div>`; }
  finally { b.disabled = false; }
};
</script>
</body>
</html>
